publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cached_network_image: ^4.0.4
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  file_picker: ^13.1.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_storage: ^14.0.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
